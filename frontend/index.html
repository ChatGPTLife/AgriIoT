<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriIoT — Agricultural IoT Environmental Monitoring</title>
    <meta name="description" content="Real-time soil sensor monitoring, 7-day weather forecasts, and automated irrigation alerts for agricultural zones powered by AWS IoT." />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem("agriiot-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
